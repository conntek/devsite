version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: product-catalog-nginx
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    user: "0:0"  # 解决权限问题
    networks:
      - web

networks:
  web:
    driver: bridge