<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <!-- CONNTEK Logo -->
  <defs>
    <style>
      .red-text { fill: #C41E3A; font-family: Arial, sans-serif; font-weight: bold; }
      .dark-text { fill: #2C3E50; font-family: Arial, sans-serif; font-weight: bold; }
      .chinese-text { fill: #2C3E50; font-family: "Microsoft YaHei", sans-serif; font-weight: normal; }
    </style>
  </defs>
  
  <!-- CONNTEK English Text -->
  <text x="20" y="80" class="red-text" font-size="60">CO</text>
  <text x="140" y="80" class="dark-text" font-size="60">NTEK</text>
  
  <!-- Chinese Text -->
  <text x="20" y="140" class="chinese-text" font-size="32">昆泰芯微电子</text>
  
  <!-- Decorative elements -->
  <rect x="20" y="155" width="280" height="2" fill="#C41E3A"/>
  <rect x="20" y="165" width="200" height="1" fill="#2C3E50"/>
</svg>